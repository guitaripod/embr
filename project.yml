name: Embr
options:
  bundleIdPrefix: com.guitaripod
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top

packages:
  EmbrCore:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage
    from: "5.19.0"
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder
    from: "0.14.0"
  MidgarKit:
    url: https://github.com/guitaripod/MidgarKit
    exactVersion: 4.3.1

x-midgar-keychain-groups: &midgarKeychainGroups
  - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
  - $(AppIdentifierPrefix)cc.midgarcorp.shared

targets:
  Embr:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Embr
        excludes:
          - "Secrets.example.swift"
    dependencies:
      - package: EmbrCore
        product: EmbrCore
      - package: GRDB
        product: GRDB
      - package: SDWebImage
        product: SDWebImage
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - package: MidgarKit
    entitlements:
      path: Embr/Embr.entitlements
      properties:
        keychain-access-groups: *midgarKeychainGroups
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${EMBR_BUNDLE_ID}
        PRODUCT_NAME: Embr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "16"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${EMBR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Embr App Store"
          DEVELOPMENT_TEAM: P4DQK6SRKR
    info:
      path: Embr/Info.plist
      properties:
        CFBundleDisplayName: Embr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - audio
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: ${EMBR_BUNDLE_ID}
            CFBundleURLSchemes:
              - embr
              - ${EMBR_BUNDLE_ID}
        CADisableMinimumFrameDurationOnPhone: true
        LSApplicationQueriesSchemes:
          - com.guitaripod.embr
          - com.guitaripod.helia
          - com.guitaripod.payday
          - com.guitaripod.pixie
          - com.guitaripod.psybeam
          - com.guitaripod.tailscode
          - com.marcusziade.aotd
          - com.marcusziade.doublekick
          - com.marcusziade.dreameater
          - com.marcusziade.inventory
          - com.marcusziade.knowtheflag
          - com.marcusziade.psywave
          - com.marcusziade.sforesight
          - com.marcusziade.solarbeam
          - com.midgarcorp.flaccy
          - com.midgarcorp.flaccy.mac
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  EmbrTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/EmbrTests
    dependencies:
      - target: Embr
      - package: MidgarKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${EMBR_BUNDLE_ID}.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ${EMBR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic

schemes:
  Embr:
    build:
      targets:
        Embr: all
        EmbrTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EmbrTests
