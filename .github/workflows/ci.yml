name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  embrcore:
    name: EmbrCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm ci
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
