name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (leave blank to use the run number)"
        required: false

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  EMBR_BUNDLE_ID: com.guitaripod.embr
  EMBR_TEAM_ID: P4DQK6SRKR
  ASC_KEY_ID: DSS2FFU68G
  ASC_ISSUER_ID: a5ebdab5-0ceb-463c-8151-195b902f117b

jobs:
  upload:
    name: Archive, sign, and upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guard against a beta build host (ITMS-90111)
        run: |
          sw_vers
          BUILD=$(sw_vers -buildVersion)
          if [[ "$BUILD" =~ [A-Z]5[0-9]{3}[a-z]$ ]]; then
            echo "::error::Runner macOS build $BUILD looks like a beta — Apple rejects beta-built binaries."
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Write Secrets.swift
        run: |
          cat > Embr/Secrets.swift <<EOF
          import Foundation

          enum Secrets {
              static let twitchClientID = "${{ secrets.TWITCH_CLIENT_ID }}"
              static let workerBaseURL = "${{ secrets.WORKER_BASE_URL }}"
              static let redirectURI = "${{ secrets.REDIRECT_URI }}"
          }
          EOF

      - name: Import signing identity and profile
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo -n "${{ secrets.SIGNING_P12_BASE64 }}" | base64 --decode -o $RUNNER_TEMP/signing.p12
          security import $RUNNER_TEMP/signing.p12 -k "$KEYCHAIN" -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode \
            -o ~/Library/MobileDevice/Provisioning\ Profiles/embr-appstore.mobileprovision

      - name: Set build number
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          [ -z "$BUILD_NUMBER" ] && BUILD_NUMBER="${{ github.run_number }}"
          echo "Using build number $BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild \
            -project Embr.xcodeproj \
            -scheme Embr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Embr.xcarchive \
            clean archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${EMBR_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>${EMBR_BUNDLE_ID}</key><string>Embr App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Embr.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
